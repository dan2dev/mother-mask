name: Deploy docs

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref containing the package version that was published
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history: the docs build reads each page's last commit date to
          # write an honest `lastmod` into the sitemap and `dateModified` into
          # its structured data. A shallow clone dates every page to the tip
          # commit, so the build detects that and omits both rather than
          # publishing a date it made up.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install package dependencies
        working-directory: packages/mother-mask
        run: bun install --frozen-lockfile

      - name: Build package
        working-directory: packages/mother-mask
        run: bun run build

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: bun run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          packageManager: bun
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
