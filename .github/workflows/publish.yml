name: Publish to NPM

on:
  push:
    branches:
      - main

# Runs still race even with this (each run's checkout is pinned to the commit
# that triggered it, not the ref's tip when the run actually starts — see the
# retry loop below for why that still matters), but serializing at least means
# they don't burn concurrent runners doing the same build/test/docs-build work
# only to have one of them lose the push anyway.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_ref: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: packages/mother-mask

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build matching docs
        working-directory: docs
        run: bun run build

      - name: Bump version, commit, tag, and push (retries on a racing release)
        id: version
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Two pushes to main close together can both reach this job before either
        # has published, so each computes the same "next" version and races to
        # push its release commit — whichever loses gets a plain non-fast-forward
        # rejection from `git push`. That's expected, not corruption: retry by
        # resetting to the now-current main and recomputing the version (it reads
        # `npm view` for the current published version, so a retry correctly
        # starts from whatever the winner just published) rather than failing the
        # whole release. This step only does cheap git/version-file work, and it
        # runs — deliberately — before `Publish` below, so a retry here can never
        # cause a second `npm publish` for the same run.
        run: |
          bump_commit_and_tag() {
          package_name="$(bun pm pkg get name | tr -d '"')"
          local_version="$(bun pm pkg get version | tr -d '"')"
          published_version="$(npm view "$package_name" version 2>/dev/null || true)"

          version="$(node - "$local_version" "$published_version" <<'NODE'
          const versions = process.argv.slice(2).filter(Boolean).map((version) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-.+)?$/.exec(version);
            if (!match) throw new Error(`Invalid semver: ${version}`);
            return {
              raw: version,
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
            };
          });

          versions.sort((a, b) =>
            a.major - b.major || a.minor - b.minor || a.patch - b.patch
          );

          const base = versions.at(-1);
          console.log(`${base.major}.${base.minor + 1}.0`);
          NODE
          )"

          node - "$version" <<'NODE'
          const fs = require("node:fs");

          const version = process.argv[2];
          const packageJsonPath = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          git add package.json
          git commit -m "chore(release): v${version} [skip ci]"
          git tag "v${version}"
          }

          bump_commit_and_tag

          attempt=1
          max_attempts=5
          until git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/v$(bun pm pkg get version | tr -d '"')"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to push release commit after ${max_attempts} attempts — a competing release keeps winning the race."
              exit 1
            fi
            echo "Push rejected (another release landed on ${{ github.ref_name }} first) — retrying, attempt $((attempt + 1))/${max_attempts}..."
            git tag -d "v$(bun pm pkg get version | tr -d '"')"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            sleep $((RANDOM % 5 + 1))
            bump_commit_and_tag
            attempt=$((attempt + 1))
          done

          echo "tag=v$(bun pm pkg get version | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-docs:
    name: Deploy matching docs
    needs: publish
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.publish.outputs.release_ref }}
    # Repository secrets are not forwarded into a called reusable workflow by
    # default — deploy-docs.yml needs CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID, so the caller has to pass its secrets context on.
    secrets: inherit
