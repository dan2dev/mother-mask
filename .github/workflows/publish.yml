name: Publish to NPM

on:
  push:
    branches:
      - main

# Runs still race even with this (each run's checkout is pinned to the commit
# that triggered it, not the ref's tip when the run actually starts — see the
# retry loop below for why that still matters), but serializing at least means
# they don't burn concurrent runners doing the same build/test/docs-build work
# only to have one of them lose the push anyway.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_ref: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: packages/mother-mask

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build matching docs
        working-directory: docs
        run: bun run build

      - name: Bump version, commit, and tag (local only)
        id: version
        # The next version is max(local, published) + 1 minor. Nothing leaves the
        # runner here: the commit and tag are pushed only after `Publish`
        # succeeds, so a failed publish never leaves an orphaned release tag.
        run: |
          package_name="$(bun pm pkg get name | tr -d '"')"
          local_version="$(bun pm pkg get version | tr -d '"')"
          published_version="$(npm view "$package_name" version 2>/dev/null || true)"

          version="$(node - "$local_version" "$published_version" <<'NODE'
          const versions = process.argv.slice(2).filter(Boolean).map((version) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-.+)?$/.exec(version);
            if (!match) throw new Error(`Invalid semver: ${version}`);
            return { major: Number(match[1]), minor: Number(match[2]), patch: Number(match[3]) };
          });

          versions.sort((a, b) =>
            a.major - b.major || a.minor - b.minor || a.patch - b.patch
          );

          const base = versions.at(-1);
          console.log(`${base.major}.${base.minor + 1}.0`);
          NODE
          )"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

          npm pkg set version="$version"
          git add package.json && git commit -m "chore(release): v${version} [skip ci]"
          git tag "v${version}"

      - name: Publish
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release commit and tag
        # The version is already on npm, so it must not change here. If main
        # moved since checkout (the checkout is pinned to the triggering commit),
        # re-apply the same version bump on top of the current main and retry.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          attempt=1
          max_attempts=5
          until git push --atomic origin "HEAD:${BRANCH}" "refs/tags/v${VERSION}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Published v${VERSION} to npm but failed to push the release commit after ${max_attempts} attempts."
              exit 1
            fi
            echo "Push rejected (${BRANCH} moved) — retrying, attempt $((attempt + 1))/${max_attempts}..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/${BRANCH}"
            npm pkg set version="$VERSION"
            git add package.json && git commit -m "chore(release): v${VERSION} [skip ci]"
            git tag -f "v${VERSION}"
            sleep $((RANDOM % 5 + 1))
            attempt=$((attempt + 1))
          done

  deploy-docs:
    name: Deploy matching docs
    needs: publish
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.publish.outputs.release_ref }}
    # Repository secrets are not forwarded into a called reusable workflow by
    # default — deploy-docs.yml needs CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID, so the caller has to pass its secrets context on.
    secrets: inherit
