<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mother-mask · Riot.js example</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">mother-mask + Riot.js</p>
      <h1>Simple input examples</h1>
      <p>Type, paste, or fill both examples below.</p>

      <div class="actions">
        <button type="button" id="fill">Fill example values</button>
        <button type="button" id="clear">Clear</button>
      </div>

      <div class="examples">
        <section>
          <label for="phone">Phone number</label>
          <span id="phone"></span>
          <p>Value: <output id="phone-value">Empty</output></p>
        </section>

        <section>
          <label for="amount">Amount</label>
          <span id="amount"></span>
          <p>Value: <output id="amount-value">Empty</output></p>
          <p>Numeric value: <output id="amount-numeric">0</output></p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
