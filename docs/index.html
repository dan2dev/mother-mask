<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/mother-mask/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/mother-mask/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/mother-mask/favicon-16x16.png" />
    <link rel="shortcut icon" href="/mother-mask/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mother-mask/apple-touch-icon.png" />
    <link rel="manifest" href="/mother-mask/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="mother-mask" />
    <meta name="theme-color" content="#18152a" />
    <!--app-head-->
    <script>
      /* Decides the theme before the first paint, so a cold load never flashes
         the wrong background. Kept in step with src/lib/theme.ts, and inlined
         into every prerendered page by prerender.ts. */
      ;(function () {
        var stored = localStorage.getItem('theme')
        var theme = stored === 'dark' || stored === 'light' ? stored : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- `data-route` names the page this document was prerendered for. In the
         dev server nothing is prerendered, so `main.ts` sees the mismatch and
         renders rather than hydrating. prerender.ts rewrites it per page. -->
    <div id="app" data-route="dev"><!--app-html--></div>
  </body>
</html>
